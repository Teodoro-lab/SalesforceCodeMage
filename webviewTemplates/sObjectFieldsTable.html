<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Field Details</title>
    <link href="${codiconsUri}" rel="stylesheet" />
    <style>
        body {
            font-family: var(--vscode-font-family);
            color: var(--vscode-foreground);
            background-color: var(--vscode-editor-background);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            border: 1px solid var(--vscode-editorGroup-border);
        }
        th, td {
            padding: 8px;
            text-align: left;
            border-bottom: 1px solid var(--vscode-editorGroup-border);
        }
        th {
            background-color: var(--vscode-editorGroupHeader-tabsBackground);
            color: var(--vscode-editorGroupHeader-tabsForeground);
        }
        .required {
            color: var(--vscode-errorForeground);
        }
        .sortable:after {
            content: " ↕";
            color: var(--vscode-editor-inactiveSelectionBackground);
        }
        .sortable {
            cursor: pointer;
        }
        input[type="text"] {
            margin-bottom: 10px;
            width: 20%;
            padding: 8px;
            border: 1px solid var(--vscode-input-border);
            background-color: var(--vscode-input-background);
            color: var(--vscode-input-foreground);
        }
        .expandable-content {
            display: none;
            overflow: hidden;
            cursor: pointer;
        }
        .expandable {
            display: block;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Fields of ${sObjectName}</h1>
    <div style="margin-bottom: 10px; display: flex; align-items: center;">
        <input type="text" id="searchInput" onchange="searchFields()" placeholder="Search for fields..." style="margin-right: 15px;">
        <div style="margin-left: auto; display: flex; gap: 18px; align-items: center;">
            <label>
                <input type="checkbox" id="ignoreSystemFields" checked onchange="toggleSystemFields()"> Ignore system fields
            </label>
            <label>
                <input type="checkbox" id="showStandardFields" checked onchange="toggleSystemFields()"> Show standard fields
            </label>
            <label>
                <input type="checkbox" id="showCustomFields" checked onchange="toggleSystemFields()"> Show custom fields
            </label>
        </div>
    </div>
    <div id="clipboardMsg" style="display:none;position:fixed;top:20px;right:30px;background:var(--vscode-editorWidget-background,#333);color:var(--vscode-editorWidget-foreground,#fff);padding:8px 16px;border-radius:6px;z-index:1000;opacity:0;transition:opacity 0.7s;box-shadow:0 2px 8px rgba(0,0,0,0.15);font-size:1rem;">Copied to clipboard</div>
    <table id="fieldsTable">
        <!-- Table headers and rows will be injected here -->
    </table>
    <script>
        // Copy object JSON to clipboard when clippy icon is clicked
        window.addEventListener('DOMContentLoaded', function() {
            const clippy = document.getElementById('filterLogsButton');
            if (clippy) {
                clippy.style.cursor = 'pointer';
                clippy.title = 'Copy object JSON to clipboard';
                clippy.addEventListener('click', function() {
                    // The object JSON string is injected as a global variable by the TS code
                    if (window.sObjectJson) {
                        navigator.clipboard.writeText(window.sObjectJson).then(function() {
                            showClipboardMsg();
                        }, function() {
                            showClipboardMsg('Failed to copy JSON');
                        });
                    } else {
                        showClipboardMsg('No object JSON found');
                    }
                });
            }
            function showClipboardMsg(msg) {
                var el = document.getElementById('clipboardMsg');
                el.textContent = msg || 'Copied to clipboard';
                el.style.display = 'block';
                el.style.opacity = '1';
                setTimeout(function() {
                    el.style.opacity = '0';
                }, 1200);
                setTimeout(function() {
                    el.style.display = 'none';
                }, 2000);
            }
        });
        document.addEventListener('DOMContentLoaded', function() {
            filterFields();
            const searchInput = document.getElementById('searchInput');
            if (searchInput) {
                searchInput.addEventListener('input', function() {
                    filterFields();
                });
            }
            document.getElementById('ignoreSystemFields').addEventListener('change', filterFields);
            document.getElementById('showStandardFields').addEventListener('change', filterFields);
            document.getElementById('showCustomFields').addEventListener('change', filterFields);

            const expandableElements = document.querySelectorAll('.expandable');
            const expandedElements = document.querySelectorAll('.expandable-content');

            expandableElements.forEach(element => {
                // Single click: allow text selection (default browser behavior)
                // Double click: expand/collapse picklist values
                element.addEventListener('dblclick', function(e) {
                    const content = this.nextElementSibling;
                    if (content.style.display === 'block') {
                        content.style.display = 'none';
                        element.style.display = 'block';
                    } else {
                        content.style.display = 'block';
                        element.style.display = 'none';
                    }
                });
            });

            expandedElements.forEach(element => {
                element.addEventListener('dblclick', function() {
                    this.style.display = 'none';
                    this.previousElementSibling.style.display = 'block';
                });
            });
        });

        // List of system fields to hide
        const systemFields = [
            'Id',
            'IsDeleted',
            'LastReferencedDate',
            'LastViewedDate',
            'CreatedById',
            'CreatedDate',
            'LastModifiedById',
            'LastModifiedDate',
            'SystemModstamp',
            'LastActivityDate',
            'OwnerId'
        ];

        // Unified filter for both search and checkboxes
        function filterFields() {
            const ignore = document.getElementById('ignoreSystemFields').checked;
            const showStandard = document.getElementById('showStandardFields').checked;
            const showCustom = document.getElementById('showCustomFields').checked;
            const input = document.getElementById('searchInput');
            const filter = input.value.toUpperCase();
            const table = document.getElementById('fieldsTable');
            const tr = table.getElementsByTagName('tr');
            for (let i = 1; i < tr.length; i++) {
                let apiName = '';
                const tds = tr[i].getElementsByTagName('td');
                for (let j = 0; j < tds.length; j++) {
                    if (tr[0].getElementsByTagName('th')[j] && tr[0].getElementsByTagName('th')[j].textContent.trim() === 'Name') {
                        apiName = tds[j].textContent.trim();
                        break;
                    }
                }
                let isSystem = systemFields.includes(apiName);
                let isCustom = apiName.endsWith('__c');
                let isStandard = !isCustom;
                // Checkbox logic
                let checkboxShow = true;
                if (ignore && isSystem) checkboxShow = false;
                if (!showStandard && isStandard) checkboxShow = false;
                if (!showCustom && isCustom) checkboxShow = false;
                // Search logic
                let searchShow = false;
                for (let j = 0; j < tds.length; j++) {
                    if (tds[j].textContent.toUpperCase().indexOf(filter) > -1) {
                        searchShow = true;
                        break;
                    }
                }
                tr[i].style.display = (checkboxShow && searchShow) ? '' : 'none';
            }
        }

        function sortTable(column) {
            let table, rows, switching, i, x, y, shouldSwitch;
            table = document.getElementById("fieldsTable");
            switching = true;
            while (switching) {
                // Start by saying: no switching is done
                switching = false;
                rows = table.rows;
                // Loop through all table rows (except the first, which contains table headers)
                for (i = 1; i < (rows.length - 1); i++) {
                    // Start by saying there should be no switching
                    shouldSwitch = false;
                    // Get the two elements you want to compare, one from current row and one from the next
                    x = rows[i].getElementsByTagName("TD")[column];
                    y = rows[i + 1].getElementsByTagName("TD")[column];
                    // Check if the two rows should switch place, based on the direction, asc or desc
                    if (x.textContent.toLowerCase() > y.textContent.toLowerCase()) {
                        // If so, mark as a switch and break the loop
                        shouldSwitch = true;
                        break;
                    }
                }
                if (shouldSwitch) {
                    // If a switch has been marked, make the switch and mark that a switch has been done
                    rows[i].parentNode.insertBefore(rows[i + 1], rows[i]);
                    switching = true;
                }
            }
        }
    </script>
</body>
</html>
