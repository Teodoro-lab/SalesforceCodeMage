<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Field Details</title>
    <link href="${codiconsUri}" rel="stylesheet" />
    <style>
        body {
            font-family: var(--vscode-font-family);
            color: var(--vscode-foreground);
            background-color: var(--vscode-editor-background);
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            border: 1px solid var(--vscode-editorGroup-border);
        }
        
        th, td {
            padding: 8px;
            text-align: left;
            border-bottom: 1px solid var(--vscode-editorGroup-border);
        }
        
        th {
            background-color: var(--vscode-editorGroupHeader-tabsBackground);
            color: var(--vscode-editorGroupHeader-tabsForeground);
        }
        
        .required {
            color: var(--vscode-errorForeground);
        }
        
        .sortable {
            cursor: pointer;
        }
        
        .sortable:after {
            content: " ↕";
            color: var(--vscode-editor-inactiveSelectionBackground);
        }
        
        .search-input {
            margin-bottom: 10px;
            width: 20%;
            padding: 8px;
            border: 1px solid var(--vscode-input-border);
            background-color: var(--vscode-input-background);
            color: var(--vscode-input-foreground);
        }
        
        .control-panel {
            margin-bottom: 10px;
            display: flex;
            align-items: center;
        }
        
        .filter-controls {
            margin-left: auto;
            display: flex;
            gap: 18px;
            align-items: center;
        }
        
        .expandable {
            display: block;
            cursor: pointer;
        }
        
        .expandable-content {
            display: none;
            overflow: hidden;
            cursor: pointer;
        }
        
        .clipboard-notification {
            display: none;
            position: fixed;
            top: 20px;
            right: 30px;
            background: var(--vscode-editorWidget-background, #333);
            color: var(--vscode-editorWidget-foreground, #fff);
            padding: 8px 16px;
            border-radius: 6px;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.7s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            font-size: 1rem;
        }
    </style>
</head>
<body>
    <h1 id="objectTitle">Loading...</h1>
    
    <div class="control-panel">
        <input type="text" 
               id="searchInput" 
               class="search-input"
               placeholder="Search for fields..." 
               style="margin-right: 15px;">
        
        <div class="filter-controls">
            <label>
                <input type="checkbox" id="hideSystemFields" checked> Ignore system fields
            </label>
            <label>
                <input type="checkbox" id="showStandardFields" checked> Show standard fields
            </label>
            <label>
                <input type="checkbox" id="showCustomFields" checked> Show custom fields
            </label>
        </div>
    </div>
    
    <div id="clipboardNotification" class="clipboard-notification">
        Copied to clipboard
    </div>
    
    <table id="fieldsTable">
        <!-- Table headers and rows will be injected here -->
    </table>

    <script>
        /**
         * Global state management
         */
        let sObjectData = null;
        
        /**
         * Configuration and constants
         */
        const SYSTEM_FIELDS = [
            'Id', 'IsDeleted', 'LastReferencedDate', 'LastViewedDate',
            'CreatedById', 'CreatedDate', 'LastModifiedById', 'LastModifiedDate',
            'SystemModstamp', 'LastActivityDate', 'OwnerId'
        ];

        const ANIMATION_TIMING = {
            FADE_OUT_DELAY: 1200,
            HIDE_DELAY: 2000
        };

        const UI_ELEMENTS = {
            searchInput: () => document.getElementById('searchInput'),
            fieldsTable: () => document.getElementById('fieldsTable'),
            hideSystemFields: () => document.getElementById('hideSystemFields'),
            showStandardFields: () => document.getElementById('showStandardFields'),
            showCustomFields: () => document.getElementById('showCustomFields'),
            clipboardNotification: () => document.getElementById('clipboardNotification')
        };

        /**
         * VSCode API integration
         */
        const vscode = acquireVsCodeApi();

        /**
         * Message handling from VSCode extension
         */
        window.addEventListener('message', (event) => {
            const message = event.data;
            handleExtensionMessage(message);
        });

        function handleExtensionMessage(message) {
            switch (message.command) {
                case 'initializeData':
                    initializeWithData(message.data);
                    break;
                default:
                    console.warn('Unknown message command:', message.command);
            }
        }

        function initializeWithData(data) {
            sObjectData = data;
            updateTitle(data.sObjectName, data.instanceUrl);
            generateTableContent(data.fields, data.sObjectName, data.instanceUrl);
            initialize();
        }

        /**
         * UI Content Generation
         */
        function updateTitle(sObjectName, instanceUrl) {
            const titleElement = document.getElementById('objectTitle');
            let titleContent = `Fields of ${sObjectName}`;
            
            if (instanceUrl) {
                titleContent += ` <a href="#" onclick="openObjectInSalesforce('${instanceUrl}', '${sObjectName}')" title="Open in Salesforce Setup" style="margin-left:8px;">🧷</a>`;
            }
            
            titleContent += ` <i id="clipboardButton" class="codicon codicon-clippy" onclick="copyObjectToClipboard()" title="Copy object JSON to clipboard" style="cursor: pointer; margin-left: 8px;"></i>`;
            titleElement.innerHTML = titleContent;
        }

        function generateTableContent(fields, sObjectName, instanceUrl) {
            const table = UI_ELEMENTS.fieldsTable();
            table.innerHTML = generateTableHeaders() + generateTableRows(fields, sObjectName, instanceUrl);
        }

        function generateTableHeaders() {
            return `
                <tr>
                    <th></th>
                    <th class="sortable" onclick="sortTable(1)">Label</th>
                    <th class="sortable" onclick="sortTable(2)">Name</th>
                    <th class="sortable" onclick="sortTable(3)">Type</th>
                    <th>Length</th>
                    <th>Required</th>
                    <th>Picklist Values</th>
                    <th>Createable</th>
                    <th>Defaulted on Create</th>
                </tr>
            `;
        }

        function generateTableRows(fields, sObjectName, instanceUrl) {
            return fields.map(field => generateTableRow(field, sObjectName, instanceUrl)).join('');
        }

        function generateTableRow(field, sObjectName, instanceUrl) {
            const picklistValues = generatePicklistValues(field);
            let picklistHTML = generatePicklistHTML(picklistValues);
            
            const requiredDisplay = field.nillable ? 'Optional' : 'Required';
            const requiredClass = field.nillable ? '' : 'required';
            
            // Generate field link if instanceUrl is available
            let fieldLink = '';
            if (instanceUrl) {
                fieldLink = ` <a href="#" onclick="openFieldInSalesforce('${instanceUrl}', '${sObjectName}', '${field.name}')" title="Open field in Salesforce Setup" style="margin-left:4px;">🧷</a>`;
            }
            
            // Add checkbox for field selection
            const checkbox = `<input type="checkbox" class="field-checkbox" data-field="${field.name}">`;
            
            return `
                <tr class="field-row">
                    <td>${checkbox}</td>
                    <td>${field.label}${fieldLink}</td>
                    <td>${field.name}</td>
                    <td>${field.type}</td>
                    <td>${field.length || 'N/A'}</td>
                    <td class="${requiredClass}">${requiredDisplay}</td>
                    ${picklistHTML}
                    <td>${field.createable ? 'Yes' : 'No'}</td>
                    <td>${field.defaultedOnCreate ? 'Yes' : 'No'}</td>
                </tr>
            `;
        }

        function generatePicklistValues(field) {
            if (field.type === 'picklist' && field.picklistValues && field.picklistValues.length > 0) {
                return field.picklistValues.map(val => `${val.label} (${val.value})`).join('<br>');
            }
            return 'N/A';
        }

        function generatePicklistHTML(picklistValues) {
            if (picklistValues.length > 50) {
                const picklistValuesShort = picklistValues.substring(0, 50) + '...';
                return `
                    <td class="expandable">${picklistValuesShort}</td>
                    <td class="expandable-content">${picklistValues}</td>
                `;
            } else {
                return `<td>${picklistValues}</td>`;
            }
        }

        /**
         * VSCode communication functions
         */
        function copyObjectToClipboard() {
            if (!sObjectData) {
                showNotification('No object data available');
                return;
            }
            
            vscode.postMessage({
                command: 'copyToClipboard',
                data: sObjectData
            });
            
            showNotification('Copied to clipboard');
        }

        function openFieldInSalesforce(instanceUrl, sObjectName, fieldName) {
            vscode.postMessage({
                command: 'openFieldInSalesforce',
                data: { instanceUrl, sObjectName, fieldName }
            });
        }

        function openObjectInSalesforce(instanceUrl, sObjectName) {
            vscode.postMessage({
                command: 'openObjectInSalesforce',
                data: { instanceUrl, sObjectName }
            });
        }

        function showNotification(message = 'Copied to clipboard') {
            const notification = UI_ELEMENTS.clipboardNotification();
            notification.textContent = message;
            notification.style.display = 'block';
            notification.style.opacity = '1';

            setTimeout(() => notification.style.opacity = '0', ANIMATION_TIMING.FADE_OUT_DELAY);
            setTimeout(() => notification.style.display = 'none', ANIMATION_TIMING.HIDE_DELAY);
        }

        /**
         * Field filtering logic
         */
        function filterFields() {
            const filterOptions = getFilterOptions();
            const searchTerm = filterOptions.searchTerm.toUpperCase();
            const tableRows = getTableRows();

            tableRows.forEach(row => {
                const fieldName = extractFieldName(row);
                const fieldType = categorizeField(fieldName);
                
                const shouldShow = shouldShowField(fieldType, filterOptions) && 
                                 matchesSearchTerm(row, searchTerm);
                
                row.style.display = shouldShow ? '' : 'none';
            });
        }

        function getFilterOptions() {
            return {
                hideSystemFields: UI_ELEMENTS.hideSystemFields().checked,
                showStandardFields: UI_ELEMENTS.showStandardFields().checked,
                showCustomFields: UI_ELEMENTS.showCustomFields().checked,
                searchTerm: UI_ELEMENTS.searchInput().value
            };
        }

        function getTableRows() {
            const table = UI_ELEMENTS.fieldsTable();
            return Array.from(table.getElementsByTagName('tr')).slice(1);
        }

        function extractFieldName(row) {
            const cells = row.getElementsByTagName('td');
            const headers = UI_ELEMENTS.fieldsTable().getElementsByTagName('th');
            
            for (let i = 0; i < headers.length; i++) {
                if (headers[i].textContent.trim() === 'Name') {
                    return cells[i]?.textContent.trim() || '';
                }
            }
            return '';
        }

        function categorizeField(fieldName) {
            return {
                isSystem: SYSTEM_FIELDS.includes(fieldName),
                isCustom: fieldName.endsWith('__c'),
                isStandard: !fieldName.endsWith('__c')
            };
        }

        function shouldShowField(fieldType, options) {
            if (options.hideSystemFields && fieldType.isSystem) return false;
            if (!options.showStandardFields && fieldType.isStandard) return false;
            if (!options.showCustomFields && fieldType.isCustom) return false;
            return true;
        }

        function matchesSearchTerm(row, searchTerm) {
            if (!searchTerm) return true;
            
            const cells = row.getElementsByTagName('td');
            return Array.from(cells).some(cell => 
                cell.textContent.toUpperCase().includes(searchTerm)
            );
        }

        /**
         * Table sorting functionality
         */
        function sortTable(columnIndex) {
            const table = UI_ELEMENTS.fieldsTable();
            const rows = Array.from(table.rows).slice(1);
            
            const sortedRows = rows.sort((rowA, rowB) => {
                const cellA = rowA.getElementsByTagName('TD')[columnIndex];
                const cellB = rowB.getElementsByTagName('TD')[columnIndex];
                
                return cellA.textContent.toLowerCase()
                    .localeCompare(cellB.textContent.toLowerCase());
            });

            sortedRows.forEach(row => table.appendChild(row));
        }

        /**
         * Expandable content functionality for picklist values
         */
        function initializeExpandableContent() {
            const expandableElements = document.querySelectorAll('.expandable');
            const expandedElements = document.querySelectorAll('.expandable-content');

            expandableElements.forEach(element => {
                element.addEventListener('dblclick', handleExpandToggle);
            });

            expandedElements.forEach(element => {
                element.addEventListener('dblclick', handleCollapseToggle);
            });
        }

        function handleExpandToggle(event) {
            const content = this.nextElementSibling;
            const isExpanded = content.style.display === 'block';
            
            content.style.display = isExpanded ? 'none' : 'block';
            this.style.display = isExpanded ? 'block' : 'none';
        }

        function handleCollapseToggle() {
            this.style.display = 'none';
            this.previousElementSibling.style.display = 'block';
        }

        /**
         * Event listeners and initialization
         */
        function initializeEventListeners() {
            const searchInput = UI_ELEMENTS.searchInput();
            if (searchInput) {
                searchInput.addEventListener('input', filterFields);
            }
            
            UI_ELEMENTS.hideSystemFields().addEventListener('change', filterFields);
            UI_ELEMENTS.showStandardFields().addEventListener('change', filterFields);
            UI_ELEMENTS.showCustomFields().addEventListener('change', filterFields);
        }

        function initialize() {
            if (sObjectData && sObjectData.fields) {
                filterFields();
                initializeEventListeners();
                initializeExpandableContent();
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            vscode.postMessage({ command: 'webviewReady' });
        });
    </script>
</body>
</html>
