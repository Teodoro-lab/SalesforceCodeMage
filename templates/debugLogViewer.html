<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salesforce Debug Log Viewer</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 8px;
            background-color: var(--vscode-editor-background);
            color: var(--vscode-editor-foreground);
            font-size: 12px;
            line-height: 1.3;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding: 8px 10px;
            background-color: var(--vscode-sideBar-background);
            border-radius: 4px;
            border: 1px solid var(--vscode-panel-border);
        }

        .file-name {
            font-weight: 600;
            color: var(--vscode-textLink-foreground);
            font-size: 13px;
        }

        .controls {
            display: flex;
            gap: 6px;
        }

        .btn {
            padding: 4px 10px;
            background-color: var(--vscode-button-background);
            color: var(--vscode-button-foreground);
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 11px;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: var(--vscode-button-hoverBackground);
        }

        .btn-secondary {
            background-color: var(--vscode-button-secondaryBackground);
            color: var(--vscode-button-secondaryForeground);
        }

        .btn-secondary:hover {
            background-color: var(--vscode-button-secondaryHoverBackground);
        }

        .search-container {
            margin-bottom: 10px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 6px 10px;
            background-color: var(--vscode-input-background);
            color: var(--vscode-input-foreground);
            border: 1px solid var(--vscode-input-border);
            border-radius: 3px;
            font-size: 12px;
            box-sizing: border-box;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--vscode-focusBorder);
        }

        .search-results {
            font-size: 10px;
            color: var(--vscode-descriptionForeground);
            margin-top: 3px;
            padding-left: 2px;
        }

        .cell {
            margin-bottom: 6px;
            border: 1px solid var(--vscode-panel-border);
            border-radius: 4px;
            overflow: hidden;
            background-color: var(--vscode-editor-background);
        }

        .cell.hidden {
            display: none;
        }

        .cell.highlight {
            border-color: var(--vscode-textLink-foreground);
            box-shadow: 0 0 4px rgba(78, 193, 176, 0.3);
        }

        .cell-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 10px;
            background-color: var(--vscode-sideBar-background);
            cursor: pointer;
            user-select: none;
            min-height: 20px;
        }

        .cell-header:hover {
            background-color: var(--vscode-list-hoverBackground);
        }

        .cell-left {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 1;
            min-width: 0;
        }

        .cell-right {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 10px;
            color: var(--vscode-descriptionForeground);
        }

        .collapse-icon {
            font-size: 10px;
            transition: transform 0.2s;
            color: var(--vscode-descriptionForeground);
            width: 12px;
            text-align: center;
        }

        .collapse-icon.collapsed {
            transform: rotate(-90deg);
        }

        .cell-badge {
            padding: 2px 5px;
            border-radius: 8px;
            font-size: 9px;
            font-weight: 600;
            text-transform: uppercase;
            flex-shrink: 0;
        }

        .cell-badge.debug { background-color: #007acc; color: white; }
        .cell-badge.error { background-color: #f14c4c; color: white; }
        .cell-badge.warning { background-color: #ffcc02; color: black; }
        .cell-badge.info { background-color: #0e8a16; color: white; }
        .cell-badge.method { background-color: #6f42c1; color: white; }
        .cell-badge.database { background-color: #fd7e14; color: white; }
        .cell-badge.system { background-color: #6c757d; color: white; }
        .cell-badge.user { background-color: #20c997; color: white; }
        .cell-badge.callout { background-color: #e83e8c; color: white; }

        .cell-message {
            font-family: 'Courier New', monospace;
            font-size: 11px;
            color: var(--vscode-editor-foreground);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        .cell-timestamp {
            font-family: 'Courier New', monospace;
            font-size: 10px;
            color: var(--vscode-descriptionForeground);
            background-color: rgba(255,255,255,0.05);
            padding: 1px 3px;
            border-radius: 2px;
        }

        .execution-info {
            font-family: 'Courier New', monospace;
            font-size: 9px;
            color: var(--vscode-descriptionForeground);
            cursor: help;
        }

        .cell-content {
            padding: 6px 8px;
            background-color: var(--vscode-textCodeBlock-background);
            font-family: 'Courier New', monospace;
            font-size: 11px;
            line-height: 1.3;
            white-space: pre-wrap;
            word-wrap: break-word;
            border-top: 1px solid var(--vscode-panel-border);
            max-height: 300px;
            overflow-y: auto;
            transition: all 0.2s ease;
        }

        .cell-content.collapsed {
            display: none;
        }

        .cell.collapsed {
            margin-bottom: 3px;
        }

        .cell.collapsed .cell-header {
            padding: 4px 8px;
        }

        .json-preview {
            color: var(--vscode-descriptionForeground);
            font-style: italic;
            font-size: 10px;
            margin-bottom: 6px;
        }

        .json-content {
            background-color: var(--vscode-textCodeBlock-background);
            border: 1px solid var(--vscode-panel-border);
            border-radius: 3px;
            padding: 8px;
            position: relative;
            font-family: 'Courier New', monospace;
            font-size: 10px;
        }

        .json-export {
            position: absolute;
            top: 4px;
            right: 4px;
            padding: 2px 6px;
            background-color: var(--vscode-badge-background);
            color: var(--vscode-badge-foreground);
            border: none;
            border-radius: 2px;
            cursor: pointer;
            font-size: 9px;
        }

        .json-export:hover {
            opacity: 0.8;
        }

        .no-content {
            text-align: center;
            padding: 30px 15px;
            color: var(--vscode-descriptionForeground);
        }

        .no-content-icon {
            font-size: 36px;
            margin-bottom: 12px;
            opacity: 0.5;
        }

        /* Highlight search matches */
        .search-highlight {
            background-color: var(--vscode-editor-findMatchHighlightBackground);
            color: var(--vscode-editor-findMatchHighlightForeground);
            padding: 1px 2px;
            border-radius: 2px;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--vscode-scrollbarSlider-background);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--vscode-scrollbarSlider-hoverBackground);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--vscode-scrollbarSlider-activeBackground);
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="file-name" id="fileName">No debug log file selected</div>
        <div class="controls">
            <button class="btn btn-secondary" onclick="collapseAll()">Collapse All</button>
            <button class="btn btn-secondary" onclick="expandAll()">Expand All</button>
            <button class="btn" onclick="refreshContent()">Refresh</button>
        </div>
    </div>

    <div class="search-container">
        <input type="text" class="search-input" id="searchInput" placeholder="Search in debug logs..." oninput="searchLogs()" />
        <div class="search-results" id="searchResults"></div>
    </div>

    <div id="content">
        <div class="no-content">
            <div class="no-content-icon">📋</div>
            <h3>No Salesforce Debug Log</h3>
            <p>Open a .log file to view its contents in a beautiful, organized format.</p>
        </div>
    </div>

    <script>
        const vscode = acquireVsCodeApi();
        let currentCells = [];
        let filteredCells = [];

        window.addEventListener('message', event => {
            const message = event.data;
            switch (message.command) {
                case 'updateContent':
                    updateContent(message.content, message.fileName);
                    break;
            }
        });

        function updateContent(cells, fileName) {
            const contentDiv = document.getElementById('content');
            const fileNameDiv = document.getElementById('fileName');
            
            if (!cells || cells.length === 0) {
                fileNameDiv.textContent = 'No debug log file selected';
                contentDiv.innerHTML = `
                    <div class="no-content">
                        <div class="no-content-icon">📋</div>
                        <h3>No Salesforce Debug Log</h3>
                        <p>Open a .log file to view its contents in a beautiful, organized format.</p>
                    </div>
                `;
                return;
            }

            fileNameDiv.textContent = fileName || 'Debug Log';
            currentCells = cells.map(cell => ({ ...cell, isCollapsed: false }));
            filteredCells = [...currentCells];
            
            renderCells();
            clearSearch();
        }

        function renderCells() {
            const contentDiv = document.getElementById('content');
            const cellsHtml = filteredCells.map(cell => createCellHtml(cell)).join('');
            contentDiv.innerHTML = cellsHtml;
        }

       function createCellHtml(cell) {
            const timestampHtml = cell.timestamp ? 
                `<span class="cell-timestamp">${escapeHtml(cell.timestamp)}</span>` : '';
            
            const executionHtml = cell.executionInfo ? 
                `<span class="execution-info" title="${escapeHtml(cell.executionInfo)}">${escapeHtml(cell.executionInfo)}</span>` : '';
            
            // Clean and trim content to remove extra whitespace
            const cleanContent = cell.content ? cell.content.replace(/\s+/g, ' ').trim() : '';
            
            let contentHtml = '';
            if (cell.isJson && cell.jsonContent) {
                // For JSON cells, show a preview and the formatted JSON
                const preview = getJsonPreview(cell.jsonContent);
                contentHtml = `
                    <div class="cell-content ${cell.isCollapsed ? 'collapsed' : ''}" id="content-${cell.id}">
                        <div class="json-preview">${escapeHtml(preview)}</div>
                        <div class="json-content">
                            <button class="json-export" onclick="exportJson('${cell.id}')">Export JSON</button>
                            <pre>${escapeHtml(JSON.stringify(cell.jsonContent, null, 2))}</pre>
                        </div>
                    </div>
                `;
            } else {
                contentHtml = `
                    <div class="cell-content ${cell.isCollapsed ? 'collapsed' : ''}" id="content-${cell.id}">${escapeHtml(cleanContent)}</div>
                `;
            }

            return `
                <div class="cell" id="cell-${cell.id}">
                    <div class="cell-header" onclick="toggleCell('${cell.id}')">
                        <div class="cell-left">
                            <span class="collapse-icon ${cell.isCollapsed ? 'collapsed' : ''}">▼</span>
                            <span class="cell-badge ${cell.type}">${cell.type}</span>
                            <span class="cell-message">${escapeHtml(cleanContent)}</span>
                        </div>
                        <div class="cell-right">
                            ${timestampHtml}
                            ${executionHtml}
                        </div>
                    </div>
                    ${contentHtml}
                </div>
            `;
        }

        function getJsonPreview(jsonContent) {
            if (Array.isArray(jsonContent)) {
                const count = jsonContent.length;
                const type = count > 0 && jsonContent[0].SObject ? jsonContent[0].SObject : 'Object';
                return `${count} ${type}${count !== 1 ? 's' : ''}...`;
            } else if (typeof jsonContent === 'object' && jsonContent !== null) {
                const type = jsonContent.SObject || 'Object';
                const keys = Object.keys(jsonContent).filter(k => k !== 'SObject');
                return `${type} with ${keys.length} field${keys.length !== 1 ? 's' : ''}...`;
            }
            return 'JSON data...';
        }

        function toggleCell(cellId) {
            const cellEl = document.getElementById(`cell-${cellId}`);
            const contentEl = document.getElementById(`content-${cellId}`);
            const iconEl = document.querySelector(`#cell-${cellId} .collapse-icon`);
            
            if (contentEl && iconEl && cellEl) {
                const isCollapsed = contentEl.classList.contains('collapsed');
                contentEl.classList.toggle('collapsed');
                iconEl.classList.toggle('collapsed');
                cellEl.classList.toggle('collapsed');
                
                // Update cell state in both arrays
                updateCellState(cellId, 'isCollapsed', !isCollapsed);
            }
        }

        function updateCellState(cellId, property, value) {
            const currentCell = currentCells.find(c => c.id === cellId);
            const filteredCell = filteredCells.find(c => c.id === cellId);
            
            if (currentCell) currentCell[property] = value;
            if (filteredCell) filteredCell[property] = value;
        }

        function collapseAll() {
            filteredCells.forEach(cell => {
                const contentEl = document.getElementById(`content-${cell.id}`);
                const iconEl = document.querySelector(`#cell-${cell.id} .collapse-icon`);
                
                if (contentEl && iconEl) {
                    contentEl.classList.add('collapsed');
                    iconEl.classList.add('collapsed');
                    updateCellState(cell.id, 'isCollapsed', true);
                }
            });
        }

        function expandAll() {
            filteredCells.forEach(cell => {
                const contentEl = document.getElementById(`content-${cell.id}`);
                const iconEl = document.querySelector(`#cell-${cell.id} .collapse-icon`);
                
                if (contentEl && iconEl) {
                    contentEl.classList.remove('collapsed');
                    iconEl.classList.remove('collapsed');
                    updateCellState(cell.id, 'isCollapsed', false);
                }
            });
        }

        function searchLogs() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
            const searchResults = document.getElementById('searchResults');

            if (!searchTerm) {
                // Show all cells if no search term
                filteredCells = [...currentCells];
                searchResults.textContent = '';
                renderCells();
                return;
            }

            // Filter cells based on search term
            filteredCells = currentCells.filter(cell => {
                const contentMatch = cell.content.toLowerCase().includes(searchTerm);
                const typeMatch = cell.type.toLowerCase().includes(searchTerm);
                const timestampMatch = cell.timestamp && cell.timestamp.toLowerCase().includes(searchTerm);
                const executionMatch = cell.executionInfo && cell.executionInfo.toLowerCase().includes(searchTerm);
                
                return contentMatch || typeMatch || timestampMatch || executionMatch;
            });

            // Update search results info
            searchResults.textContent = `Found ${filteredCells.length} of ${currentCells.length} log entries`;

            // Re-render with filtered cells
            renderCells();

            // Highlight search matches
            setTimeout(() => highlightSearchMatches(searchTerm), 50);
        }

        function highlightSearchMatches(searchTerm) {
            const cells = document.querySelectorAll('.cell');
            cells.forEach(cell => {
                const content = cell.querySelector('.cell-content');
                const message = cell.querySelector('.cell-message');
                
                if (content && !content.querySelector('.json-content')) {
                    highlightInElement(content, searchTerm);
                }
                if (message) {
                    highlightInElement(message, searchTerm);
                }
            });
        }

        function highlightInElement(element, searchTerm) {
            const walker = document.createTreeWalker(
                element,
                NodeFilter.SHOW_TEXT,
                null,
                false
            );

            const textNodes = [];
            let node;
            while (node = walker.nextNode()) {
                textNodes.push(node);
            }

            textNodes.forEach(textNode => {
                const text = textNode.textContent;
                const regex = new RegExp(`(${escapeRegex(searchTerm)})`, 'gi');
                if (regex.test(text)) {
                    const highlightedText = text.replace(regex, '<span class="search-highlight">$1</span>');
                    const wrapper = document.createElement('span');
                    wrapper.innerHTML = highlightedText;
                    textNode.parentNode.replaceChild(wrapper, textNode);
                }
            });
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            document.getElementById('searchResults').textContent = '';
        }

        function escapeRegex(string) {
            return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        function refreshContent() {
            vscode.postMessage({ command: 'refresh' });
        }

        function exportJson(cellId) {
            const cell = currentCells.find(c => c.id === cellId);
            if (cell && cell.isJson) {
                vscode.postMessage({ 
                    command: 'exportJson', 
                    data: cell.jsonContent 
                });
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
