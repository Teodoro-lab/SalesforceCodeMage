<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Query Results</title>
    <link href="${codiconsUri}" rel="stylesheet" />
    <style>
        body {
            font-family: var(--vscode-font-family);
            color: var(--vscode-foreground);
            background-color: var(--vscode-editor-background);
            padding: 20px;
        }
        
        .header {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--vscode-editorGroup-border);
        }
        
        .query-display {
            background: var(--vscode-textCodeBlock-background);
            border: 1px solid var(--vscode-editorGroup-border);
            border-radius: 3px;
            padding: 15px;
            margin: 15px 0;
            font-family: var(--vscode-editor-font-family, 'Consolas', monospace);
            font-size: 13px;
            white-space: pre-wrap;
        }
        
        .controls {
            margin: 15px 0;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .btn {
            padding: 6px 12px;
            border: 1px solid var(--vscode-button-border, transparent);
            background: var(--vscode-button-background);
            color: var(--vscode-button-foreground);
            cursor: pointer;
            border-radius: 3px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .btn:hover {
            background: var(--vscode-button-hoverBackground);
        }
        
        .results-container {
            border: 1px solid var(--vscode-editorGroup-border);
            border-radius: 3px;
            max-height: 70vh;
            overflow: auto;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 0;
        }
        
        th, td {
            padding: 8px 12px;
            text-align: left;
            border-bottom: 1px solid var(--vscode-editorGroup-border);
            border-right: 1px solid var(--vscode-editorGroup-border);
            vertical-align: top;
        }
        
        th:last-child, td:last-child {
            border-right: none;
        }
        
        th {
            background-color: var(--vscode-editorGroupHeader-tabsBackground);
            color: var(--vscode-editorGroupHeader-tabsForeground);
            position: sticky;
            top: 0;
            z-index: 10;
        }
        
        .no-results {
            padding: 40px;
            text-align: center;
            color: var(--vscode-descriptionForeground);
        }
        
        .results-info {
            color: var(--vscode-descriptionForeground);
            font-size: 12px;
            margin-bottom: 10px;
        }

        /* Nested object styles */
        .nested-object {
            background: var(--vscode-editor-inactiveSelectionBackground);
            border: 1px solid var(--vscode-editorGroup-border);
            border-radius: 3px;
            padding: 8px;
            margin: 2px 0;
            font-family: var(--vscode-editor-font-family, 'Consolas', monospace);
            font-size: 12px;
            max-width: 300px;
            max-height: 150px;
            overflow: auto;
        }

        .nested-object-header {
            font-weight: bold;
            color: var(--vscode-symbolIcon-objectForeground);
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .nested-records {
            border-left: 2px solid var(--vscode-editorGroup-border);
            padding-left: 8px;
        }

        .nested-record {
            margin: 4px 0;
            padding: 4px;
            background: var(--vscode-editor-background);
            border-radius: 2px;
            border: 1px solid var(--vscode-editorGroup-border);
        }

        .nested-field {
            margin: 2px 0;
            font-size: 11px;
        }

        .nested-field-name {
            color: var(--vscode-symbolIcon-propertyForeground);
            font-weight: 500;
        }

        .nested-field-value {
            color: var(--vscode-foreground);
            margin-left: 8px;
        }

        .expandable-nested {
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            color: var(--vscode-textLink-foreground);
            text-decoration: underline;
            font-size: 11px;
        }

        .expandable-nested:hover {
            color: var(--vscode-textLink-activeForeground);
        }

        .collapsed-nested {
            display: none;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1 id="title">Query Results</h1>
        <div class="results-info" id="resultsInfo">Loading...</div>
    </div>
    
    <div class="controls">
        <button class="btn" onclick="copyQuery()" title="Copy query to clipboard">
            <i class="codicon codicon-copy"></i>
            Copy Query
        </button>
        <button class="btn" onclick="exportResults()" title="Export results to CSV">
            <i class="codicon codicon-export"></i>
            Export CSV
        </button>
        <button class="btn" onclick="expandAllNested()" title="Expand all nested objects">
            <i class="codicon codicon-expand-all"></i>
            Expand All
        </button>
        <button class="btn" onclick="collapseAllNested()" title="Collapse all nested objects">
            <i class="codicon codicon-collapse-all"></i>
            Collapse All
        </button>
    </div>
    
    <div class="query-display" id="queryDisplay"></div>
    
    <div class="results-container">
        <div id="resultsTable"></div>
    </div>

    <script>
        const vscode = acquireVsCodeApi();
        let currentData = null;
        
        window.addEventListener('message', (event) => {
            const message = event.data;
            if (message.command === 'displayResults') {
                displayResults(message.data);
            }
        });
        
        function displayResults(data) {
            currentData = data;
            
            document.getElementById('title').textContent = `Query Results: ${data.sObjectName}`;
            document.getElementById('queryDisplay').textContent = data.query;
            document.getElementById('resultsInfo').textContent = 
                `${data.records.length} record(s) returned${data.totalSize > data.records.length ? ` of ${data.totalSize} total` : ''}`;
            
            const resultsTable = document.getElementById('resultsTable');
            
            if (!data.records || data.records.length === 0) {
                resultsTable.innerHTML = '<div class="no-results">No records found</div>';
                return;
            }
            
            // Get all unique keys
            const allKeys = new Set();
            data.records.forEach(record => {
                Object.keys(record).forEach(key => {
                    if (key !== 'attributes') {
                        allKeys.add(key);
                    }
                });
            });
            
            const keys = Array.from(allKeys);
            
            // Build table
            let html = '<table>';
            
            // Header
            html += '<tr>';
            keys.forEach(key => {
                html += `<th>${key}</th>`;
            });
            html += '</tr>';
            
            // Rows
            data.records.forEach((record, recordIndex) => {
                html += '<tr>';
                keys.forEach(key => {
                    const value = record[key];
                    const displayValue = formatCellValue(value, key, recordIndex);
                    html += `<td>${displayValue}</td>`;
                });
                html += '</tr>';
            });
            
            html += '</table>';
            resultsTable.innerHTML = html;
        }
        
        function formatCellValue(value, fieldName, recordIndex) {
            if (value === null || value === undefined) {
                return '';
            }
            
            // Handle nested objects (subqueries and relationships)
            if (typeof value === 'object') {
                return formatNestedObject(value, fieldName, recordIndex);
            }
            
            // Handle regular values
            return String(value);
        }
        
        function formatNestedObject(obj, fieldName, recordIndex) {
            // Handle Salesforce query result objects (like subqueries)
            if (obj.totalSize !== undefined && obj.records !== undefined) {
                return formatSubqueryResult(obj, fieldName, recordIndex);
            }
            
            // Handle regular relationship objects
            if (obj.attributes && obj.attributes.type) {
                return formatRelationshipObject(obj, fieldName, recordIndex);
            }
            
            // Handle generic objects
            return formatGenericObject(obj, fieldName, recordIndex);
        }
        
        function formatSubqueryResult(subquery, fieldName, recordIndex) {
            const uniqueId = `subquery_${recordIndex}_${fieldName}`;
            const recordCount = subquery.records ? subquery.records.length : 0;
            const totalSize = subquery.totalSize || recordCount;
            
            let html = `<div class="nested-object">
                <div class="nested-object-header">
                    <i class="codicon codicon-database"></i>
                    <span>${fieldName} (${recordCount}/${totalSize} records)</span>
                    <span class="expandable-nested" onclick="toggleNested('${uniqueId}')">
                        <i class="codicon codicon-chevron-right" id="icon_${uniqueId}"></i>
                        Details
                    </span>
                </div>
                <div class="nested-records collapsed-nested" id="${uniqueId}">`;
            
            if (subquery.records && subquery.records.length > 0) {
                subquery.records.forEach((record, index) => {
                    html += `<div class="nested-record">
                        <div style="font-weight: bold; margin-bottom: 4px;">Record ${index + 1}:</div>`;
                    
                    Object.keys(record).forEach(key => {
                        if (key !== 'attributes') {
                            const val = record[key];
                            const displayVal = val === null || val === undefined ? '<em>null</em>' : 
                                              typeof val === 'object' ? JSON.stringify(val) : String(val);
                            html += `<div class="nested-field">
                                <span class="nested-field-name">${key}:</span>
                                <span class="nested-field-value">${displayVal}</span>
                            </div>`;
                        }
                    });
                    
                    html += '</div>';
                });
            } else {
                html += '<div style="padding: 8px; font-style: italic; color: var(--vscode-descriptionForeground);">No records</div>';
            }
            
            html += '</div></div>';
            return html;
        }
        
        function formatRelationshipObject(obj, fieldName, recordIndex) {
            const uniqueId = `rel_${recordIndex}_${fieldName}`;
            const typeName = obj.attributes.type;
            
            let html = `<div class="nested-object">
                <div class="nested-object-header">
                    <i class="codicon codicon-symbol-object"></i>
                    <span>${typeName}</span>
                    <span class="expandable-nested" onclick="toggleNested('${uniqueId}')">
                        <i class="codicon codicon-chevron-right" id="icon_${uniqueId}"></i>
                        Details
                    </span>
                </div>
                <div class="nested-records collapsed-nested" id="${uniqueId}">
                    <div class="nested-record">`;
            
            Object.keys(obj).forEach(key => {
                if (key !== 'attributes') {
                    const val = obj[key];
                    const displayVal = val === null || val === undefined ? '<em>null</em>' : String(val);
                    html += `<div class="nested-field">
                        <span class="nested-field-name">${key}:</span>
                        <span class="nested-field-value">${displayVal}</span>
                    </div>`;
                }
            });
            
            html += '</div></div></div>';
            return html;
        }
        
        function formatGenericObject(obj, fieldName, recordIndex) {
            const uniqueId = `obj_${recordIndex}_${fieldName}`;
            
            let html = `<div class="nested-object">
                <div class="nested-object-header">
                    <i class="codicon codicon-json"></i>
                    <span>Object</span>
                    <span class="expandable-nested" onclick="toggleNested('${uniqueId}')">
                        <i class="codicon codicon-chevron-right" id="icon_${uniqueId}"></i>
                        Details
                    </span>
                </div>
                <div class="nested-records collapsed-nested" id="${uniqueId}">
                    <pre style="font-size: 11px; margin: 0; white-space: pre-wrap;">${JSON.stringify(obj, null, 2)}</pre>
                </div>
            </div>`;
            
            return html;
        }
        
        function toggleNested(uniqueId) {
            const element = document.getElementById(uniqueId);
            const icon = document.getElementById('icon_' + uniqueId);
            
            if (element.classList.contains('collapsed-nested')) {
                element.classList.remove('collapsed-nested');
                icon.classList.remove('codicon-chevron-right');
                icon.classList.add('codicon-chevron-down');
            } else {
                element.classList.add('collapsed-nested');
                icon.classList.remove('codicon-chevron-down');
                icon.classList.add('codicon-chevron-right');
            }
        }
        
        function expandAllNested() {
            const allNested = document.querySelectorAll('.collapsed-nested');
            const allIcons = document.querySelectorAll('[id^="icon_"]');
            
            allNested.forEach(element => {
                element.classList.remove('collapsed-nested');
            });
            
            allIcons.forEach(icon => {
                icon.classList.remove('codicon-chevron-right');
                icon.classList.add('codicon-chevron-down');
            });
        }
        
        function collapseAllNested() {
            const allNested = document.querySelectorAll('.nested-records');
            const allIcons = document.querySelectorAll('[id^="icon_"]');
            
            allNested.forEach(element => {
                element.classList.add('collapsed-nested');
            });
            
            allIcons.forEach(icon => {
                icon.classList.remove('codicon-chevron-down');
                icon.classList.add('codicon-chevron-right');
            });
        }
        
        function copyQuery() {
            if (currentData && currentData.query) {
                vscode.postMessage({
                    command: 'copyToClipboard',
                    data: currentData.query
                });
            }
        }
        
        function exportResults() {
            if (currentData) {
                vscode.postMessage({
                    command: 'exportResults',
                    data: currentData
                });
            }
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            vscode.postMessage({ command: 'webviewReady' });
        });
    </script>
</body>
</html>
